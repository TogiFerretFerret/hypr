# -------------------------------------------------------------------------------------
# 7. KEYBINDINGS
# -------------------------------------------------------------------------------------

# Core: So important I can't risk them NOT being loaded
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, ghostty -e yazi ~
bind = $mainMod, R, exec, $menu
bind = $mainMod, C, killactive,
# why did I ever leave this in?
# bind = $mainMod, M, exit
bind = $mainMod, F, togglefloating # I float occasionally

# Clipboard (quickshell) — uses global shortcut
bind = $mainMod, V, global, quickshell:clipboard
bind = $mainMod SHIFT, V, exec, rofi -modi emoji -show emoji

# Random Useful Binds
bind = ALT SHIFT, S, exec, /home/river/go/bin/spofi
bind = ALT SHIFT, D, global, quickshell:notif-dnd
bind = ALT SHIFT, E, global, quickshell:notif-dismiss
bind = ALT SHIFT, C, global, quickshell:notif-clear
bind = CTRL SHIFT, 5, exec, hyprshot --mode region

# Random Pseudotiling Stuff I Have Never Used
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Movement Keybindings (resizing, focus)
source = ~/.config/hypr/modules/binds/movement.conf

# Workspaces (non-special)
source = ~/.config/hypr/modules/binds/workspaces.conf

# Workspaces (special)
source = ~/.config/hypr/modules/binds/special.conf

# Wallpaper switching
bind = $mainMod, W, global, quickshell:wallpaper
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh

# Karaoke mode
bind = $mainMod, K, global, quickshell:karaoke

# Multimedia keys
source = ~/.config/hypr/modules/binds/multimedia.conf
