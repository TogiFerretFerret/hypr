# -------------------------------------------------------------------------------------
# 3. AUTOSTART
# -------------------------------------------------------------------------------------

# Core Services
exec-once = hyprpm reload
exec-once = hypridle
exec-once = fcitx5 &
exec-once = wl-paste --watch clipvault store
exec-once = systemctl --user start hyprpolkitagent

# UI Elements
exec-once = quickshell &
# Notifications handled by quickshell NotificationServer
# Network handled by quickshell native widget
# Bluetooth handled by quickshell native widget
# Wallpaper with swww (color-synced)
exec-once = swww-daemon &
exec-once = sleep 1 && ~/.config/hypr/scripts/wallpaper.sh ~/Pictures/Wallpapers/lakeside-dock-flowers.png

# Stats Bridge (for dashboards)
exec-once = python3 ~/.config/hypr/scripts/stats-bridge.py &

# Visual Fixes
exec-once = hyprctl setcursor Bibata-Hyprland 24

# Safety Net (Prevents SDDM hanging on logout)
exec-shutdown = sudo systemctl restart sddm

